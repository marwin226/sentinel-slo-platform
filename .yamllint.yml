extends: default
ignore: |
  observability/rules/
  platform/observability/slo/
rules:
  line-length: {max: 200, level: warning}
  document-start: disable
  truthy: {allowed-values: ["true", "false", "on"], check-keys: false}
  comments: {min-spaces-from-content: 1}
  braces: {max-spaces-inside: 1}
  brackets: {max-spaces-inside: 1}
  indentation: {spaces: consistent, indent-sequences: whatever}
