apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - slo/checkout-api-prometheusrule.yaml   # generated from slo/checkout-api.yaml
  - rollout-alerts.yaml
configMapGenerator:
  - name: grafana-dashboard-sentinel-slo
    files: [dashboards/sentinel-slo.json]
    options:
      labels: {grafana_dashboard: "1"}
      disableNameSuffixHash: true
