apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: checkout-api
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: sentinel
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  strategy:
    canary:
      canaryService: checkout-api-canary
      stableService: checkout-api-stable
      # The SLO gate runs in the background for the whole rollout. If the canary burns
      # error budget faster than 2x (or p99 > 300ms) the rollout aborts and traffic
      # returns to the stable ReplicaSet automatically — no human in the loop.
      analysis:
        templates:
          - templateName: checkout-slo-gate
        startingStep: 1
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        - setWeight: 25
        - pause: {duration: 2m}
        - setWeight: 50
        - pause: {duration: 2m}
        - setWeight: 75
        - pause: {duration: 1m}
      abortScaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
        app.kubernetes.io/part-of: sentinel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: checkout-api
      terminationGracePeriodSeconds: 20
      containers:
        - name: checkout-api
          image: ghcr.io/joshilfernandes/sentinel-checkout-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "0.1.0"
            - name: BUILD_ID
              value: "local"
            - name: FAULT_ERROR_RATE
              value: "0"
            - name: FAULT_LATENCY_MS
              value: "0"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-opentelemetry-collector.monitoring.svc:4318
            - name: OTEL_SERVICE_NAME
              value: checkout-api
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              # give kube-proxy time to drop the endpoint before SIGTERM
              exec: {command: ["sleep", "5"]}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
