apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: checkout
resources:
- ../../base
- namespace.yaml
# CI (release workflow) bumps this tag on every merge to main -> Argo CD syncs -> canary starts.
images:
- name: ghcr.io/marwin226/sentinel-checkout-api
  newTag: sha-12cb227
patches:
- path: release-patch.yaml
  target:
    kind: Rollout
    name: checkout-api
