# Local (docker compose) Prometheus — same SLO rules as the cluster, generated from slo/*.yaml.
global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: checkout-api
    static_configs:
      - targets: ["checkout-stable:8080", "checkout-canary:8080"]
  - job_name: incident-copilot
    static_configs:
      - targets: ["incident-copilot:8081"]
