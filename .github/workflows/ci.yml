name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [checkout-api, incident-copilot]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - name: Install
        run: pip install -r services/${{ matrix.service }}/requirements-dev.txt
      - name: Lint
        run: |
          ruff check services/${{ matrix.service }}
          ruff format --check services/${{ matrix.service }}
      - name: Unit tests
        working-directory: services/${{ matrix.service }}
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80

  reliability-as-code:
    name: SLO rules & manifests
    runs-on: ubuntu-latest
    env:
      PROM_VERSION: "3.5.0"
      KUBECONFORM_VERSION: "0.7.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml==6.0.2 yamllint==1.37.1
      - name: SLO rules are generated from slo/*.yaml (no drift)
        run: python scripts/generate_slo_rules.py --check
      - name: Install promtool + kubeconform
        run: |
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
      - name: Check rules
        run: promtool check rules observability/rules/*.yml
      - name: Unit-test alerts (bad release pages, healthy service stays quiet)
        run: promtool test rules observability/tests/*.test.yml
      - name: yamllint
        run: yamllint -c .yamllint.yml .
      - name: Render & validate every Kustomize target against Kubernetes + CRD schemas
        run: |
          set -euo pipefail
          for dir in deploy/checkout-api/overlays/dev deploy/checkout-api/overlays/prod \
                     deploy/incident-copilot/base platform/observability; do
            echo "::group::$dir"
            kubectl kustomize "$dir" | kubeconform -strict -summary \
              -kubernetes-version 1.33.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
          kubeconform -strict -summary -kubernetes-version 1.33.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            platform/argocd platform/policies
          # Chaos Mesh CRDs are not in the public schema catalog: parse-check only
          kubeconform -summary -ignore-missing-schemas platform/chaos

  dockerfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: services/checkout-api/Dockerfile}
      - uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: services/incident-copilot/Dockerfile}
